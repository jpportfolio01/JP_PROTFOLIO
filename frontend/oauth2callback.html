<!DOCTYPE html>
<html>
<head>
    <title>Google OAuth2 Callback</title>
    <link rel="icon" type="image/png" href="dr_parmar.png">
    <link rel="apple-touch-icon" href="dr_parmar.png">
</head>
<body>
    <div style="font-family: sans-serif; text-align: center; padding: 40px;">
        <h3>Completing Google Authentication...</h3>
        <p>Please wait while your institutional profile is being verified.</p>
    </div>
    <script>
        (function() {
            try {
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                const accessToken = params.get('access_token');
                const idToken = params.get('id_token');
                const error = params.get('error');

                if (window.opener && !window.opener.closed) {
                    if (error) {
                        window.opener.postMessage({ type: 'JUET_GOOGLE_OAUTH_ERROR', error: error }, '*');
                    } else if (accessToken || idToken) {
                        window.opener.postMessage({ 
                            type: 'JUET_GOOGLE_OAUTH_TOKEN', 
                            accessToken: accessToken,
                            idToken: idToken 
                        }, '*');
                    }
                    window.close();
                } else {
                    window.location.href = 'sql-practice.html';
                }
            } catch(e) {
                console.error('OAuth callback error:', e);
            }
        })();
    </script>
</body>
</html>
